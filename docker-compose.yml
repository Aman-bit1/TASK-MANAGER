services:

  backend:
    build: ./backend
    container_name: taskflow-backend

    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}

    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: taskflow-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped